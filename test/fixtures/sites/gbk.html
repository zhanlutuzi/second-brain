<!DOCTYPE html>
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=gbk"><title>GBK 编码页面</title></head><body><article><h1>GBK 编码页面</h1><p>很多人以为知识管理的难点在于收集，其实真正的难点在于持续整理。收集只需要一次点击，而整理需要反复阅读、归类和建立联系。</p><p>一个可行的做法是把整理变成批量任务：平时只负责把东西丢进收件箱，每天固定一个时间集中处理，处理时只做三件事——判断类型、写一句话摘要、放到正确的位置。</p><p>这样做的好处是，收集的门槛足够低，不会打断手头的工作；而整理的时候注意力集中，判断也更一致。时间久了，你会发现知识库的结构是自然长出来的，而不是一开始设计出来的。</p><p>最后，整理的结果要能回溯到原始资料。每一条结论后面都应该能找到出处，这样当你怀疑某个观点时，可以回到原文重新判断，而不是凭记忆。</p></article><script>window.__INITIAL_STATE__={"track":true};</script></body></html>
